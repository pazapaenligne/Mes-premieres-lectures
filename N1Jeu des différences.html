<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeu des différences &mdash; Fadi est malade</title><style>
:root{--bleu:#36BBD6;--bleu-clair:#E4F7FB;--vert:#C9D646;--vert-clair:#F3F7DD;--jaune:#FCC104;--jaune-clair:#FFF3D6;--rouge:#E6352B;--gris:#EBEBEB;--noir:#2E2E2D;--vertfonce:#0C8356;--r1:22px;--r2:16px}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--noir);background:linear-gradient(160deg,var(--bleu-clair),var(--vert-clair));-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--noir);outline-offset:3px}
.app{max-width:760px;margin:0 auto;padding:10px}
.carte-blanche{background:#fff;border-radius:var(--r1);box-shadow:0 3px 0 rgba(46,46,45,.08);padding:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-boite{background:#fff;border-radius:var(--r2);padding:4px 8px;flex:0 0 auto;display:flex}.logo{height:44px;width:auto;display:block}
.top h1{font-size:20px;margin:0;flex:1 1 0;min-width:0}.top .sous{display:block;font-size:14px;font-weight:normal;color:#444;margin-top:2px}
.btn{min-height:56px;border-radius:var(--r2);border:0;font-size:19px;font-weight:bold;padding:10px 22px}
.btn-jaune{background:var(--jaune);box-shadow:0 4px 0 #c99a00}.btn-jaune:disabled{background:var(--gris);box-shadow:0 4px 0 #cfcfcf;color:#6b6b6b;cursor:default}
.btn-bleu{background:var(--bleu-clair);border:2px solid var(--bleu);font-size:17px;min-height:52px}.btn-bleu:disabled{opacity:.55;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1 1 130px;max-width:300px}
h2{font-size:26px;text-align:center;margin:4px 0 6px}
.consigne{background:var(--bleu-clair);border-radius:var(--r2);padding:12px 16px;font-size:23px;font-weight:bold;text-align:center;margin:0 0 10px;line-height:1.35}
.retour{min-height:34px;font-size:20px;font-weight:bold;text-align:center;margin:8px 0 2px}.retour.bien{color:#2d6a1a}.retour.aide{color:#7a4a00}
.bulle{background:var(--vertfonce);color:#fff;border-radius:26px;padding:14px 20px;font-size:21px;font-weight:bold;text-align:center;line-height:1.35;margin:12px auto;max-width:420px}
.fin{background:var(--vert-clair);border:3px solid var(--vert);border-radius:var(--r2);padding:10px;text-align:center;margin-top:10px}
.note{font-size:19px;font-weight:bold;color:#5a3b00;background:var(--jaune-clair);border:2px solid var(--jaune);border-radius:var(--r2);padding:8px 12px;text-align:center;margin:10px 0 0}
#accueil{text-align:center;padding:6px 0 10px}
.ptit{font-size:17px;font-weight:bold;margin:0;color:#1A1919}
.leofadi{display:inline-block;margin:4px 0 8px;padding:6px 18px;background:#B4D8FD;font-family:"Arial Rounded MT Bold","Arial Black",Arial,sans-serif;font-weight:900;font-size:clamp(38px,12vw,64px);letter-spacing:1px;color:#B4D8FD;-webkit-text-stroke:9px #196652;paint-order:stroke fill;text-shadow:0 0 0 #196652;line-height:1.1}
.leofadi small{font-size:.55em}
#accueil img.titre{width:min(380px,90%);border:0;border-radius:0;margin:0 auto}
#accueil img{width:min(300px,70%);height:auto;border-radius:var(--r1);border:4px solid var(--bleu);display:block;margin:6px auto 12px}
#accueil h2{font-size:30px}#accueil .btn{font-size:26px;min-height:68px;padding:12px 40px}
.etoiles{display:flex;justify-content:center;gap:10px;margin:6px 0 2px}
.etoiles span{font-size:48px;line-height:1;display:inline-block;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.etoiles span:nth-child(2){animation-delay:.2s}.etoiles span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.paire{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;justify-items:center;margin:6px 0}
@media (min-width:700px){.paire{grid-template-columns:repeat(2,minmax(0,1fr))}}
.img-diff{position:relative;width:100%;max-width:340px;border:3px solid var(--vertfonce);border-radius:6px;overflow:hidden;line-height:0;touch-action:manipulation;cursor:pointer;background:#fff}
.img-diff img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.img-diff svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.t{stroke-dasharray:1;stroke-dashoffset:0;animation:trace .8s ease-out}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.paire.grand{grid-template-columns:minmax(0,1fr)}.paire.grand .img-diff{max-width:700px}
.compteur{font-size:20px;font-weight:bold;text-align:center;margin:6px 0}
.pts{display:flex;gap:8px;justify-content:center;margin:4px 0}.pt{width:26px;height:26px;border-radius:50%;background:var(--gris);border:2px solid #bbb}.pt.f{background:var(--rouge);border-color:var(--rouge)}
.finale{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}.finale img{width:170px;height:auto;display:block}
</style></head><body>
