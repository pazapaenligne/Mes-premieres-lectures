<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mots mêlés &mdash; Fadi est malade</title><style>
:root{--bleu:#36BBD6;--bleu-clair:#E4F7FB;--vert:#C9D646;--vert-clair:#F3F7DD;--jaune:#FCC104;--jaune-clair:#FFF3D6;--rouge:#E6352B;--gris:#EBEBEB;--noir:#2E2E2D;--vertfonce:#0C8356;--r1:22px;--r2:16px}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--noir);background:linear-gradient(160deg,var(--bleu-clair),var(--vert-clair));-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--noir);outline-offset:3px}
.app{max-width:760px;margin:0 auto;padding:10px}
.carte-blanche{background:#fff;border-radius:var(--r1);box-shadow:0 3px 0 rgba(46,46,45,.08);padding:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-boite{background:#fff;border-radius:var(--r2);padding:4px 8px;flex:0 0 auto;display:flex}.logo{height:44px;width:auto;display:block}
.top h1{font-size:20px;margin:0;flex:1 1 0;min-width:0}.top .sous{display:block;font-size:14px;font-weight:normal;color:#444;margin-top:2px}
.btn{min-height:56px;border-radius:var(--r2);border:0;font-size:19px;font-weight:bold;padding:10px 22px}
.btn-jaune{background:var(--jaune);box-shadow:0 4px 0 #c99a00}.btn-jaune:disabled{background:var(--gris);box-shadow:0 4px 0 #cfcfcf;color:#6b6b6b;cursor:default}
.btn-bleu{background:var(--bleu-clair);border:2px solid var(--bleu);font-size:17px;min-height:52px}.btn-bleu:disabled{opacity:.55;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1 1 130px;max-width:300px}
h2{font-size:26px;text-align:center;margin:4px 0 6px}
.consigne{background:var(--bleu-clair);border-radius:var(--r2);padding:12px 16px;font-size:23px;font-weight:bold;text-align:center;margin:0 0 10px;line-height:1.35}
.retour{min-height:34px;font-size:20px;font-weight:bold;text-align:center;margin:8px 0 2px}.retour.bien{color:#2d6a1a}.retour.aide{color:#7a4a00}
.bulle{background:var(--vertfonce);color:#fff;border-radius:26px;padding:14px 20px;font-size:21px;font-weight:bold;text-align:center;line-height:1.35;margin:12px auto;max-width:420px}
.fin{background:var(--vert-clair);border:3px solid var(--vert);border-radius:var(--r2);padding:10px;text-align:center;margin-top:10px}
.note{font-size:19px;font-weight:bold;color:#5a3b00;background:var(--jaune-clair);border:2px solid var(--jaune);border-radius:var(--r2);padding:8px 12px;text-align:center;margin:10px 0 0}
#accueil{text-align:center;padding:6px 0 10px}
.ptit{font-size:17px;font-weight:bold;margin:0;color:#1A1919}
.leofadi{display:inline-block;margin:4px 0 8px;padding:6px 18px;background:#B4D8FD;font-family:"Arial Rounded MT Bold","Arial Black",Arial,sans-serif;font-weight:900;font-size:clamp(38px,12vw,64px);letter-spacing:1px;color:#B4D8FD;-webkit-text-stroke:9px #196652;paint-order:stroke fill;text-shadow:0 0 0 #196652;line-height:1.1}
.leofadi small{font-size:.55em}
#accueil img.titre{width:min(380px,90%);border:0;border-radius:0;margin:0 auto}
#accueil img{width:min(300px,70%);height:auto;border-radius:var(--r1);border:4px solid var(--bleu);display:block;margin:6px auto 12px}
#accueil h2{font-size:30px}#accueil .btn{font-size:26px;min-height:68px;padding:12px 40px}
.etoiles{display:flex;justify-content:center;gap:10px;margin:6px 0 2px}
.etoiles span{font-size:48px;line-height:1;display:inline-block;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.etoiles span:nth-child(2){animation-delay:.2s}.etoiles span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.grille{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;max-width:540px;margin:8px auto;background:var(--noir);border:2px solid var(--noir)}
.cel{aspect-ratio:1;min-width:0;border:0;border-radius:0;background:#fff;font-size:clamp(15px,4.6vw,26px);font-weight:bold;padding:0;display:flex;align-items:center;justify-content:center}
.cel.dep{background:var(--jaune);}
.cel.trouve{background:var(--vert)}
.cel.pulse{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (max-width:480px){.app{padding:4px}.carte-blanche{padding:8px}.grille{gap:1px}.cel{font-size:clamp(17px,5.6vw,26px)}}
.cel.indice{outline:4px solid var(--rouge);outline-offset:-4px}
.liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;max-width:420px;margin:12px auto;padding:12px;border:3px solid var(--vertfonce);border-radius:var(--r2)}
.mot{font-size:22px;font-weight:bold;text-align:center;padding:6px 4px;border-radius:12px}
.mot.ok{text-decoration:line-through;text-decoration-thickness:3px;color:var(--noir)}
</style></head><body>

MOTS.forEach(function(m){var t=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)DIRS.forEach(function(d){var ok=true,k;for(k=0;k<m.length;k++){var rr=r+d[0]*k,cc=c+d[1]*k;if(rr<0||cc<0||rr>=N||cc>=N||lettre(rr,cc)!==m[k]){ok=false;break}}if(ok)t.push([r,c,d[0],d[1]])});POS[m]=t});
var cels=[],trouves={},dep=null,COUL=["#36BBD6","#C9D646","#FCC104","#F28B82","#F59E42","#7FD1A0"],nbT=0;
function dessiner(){while(grille.firstChild)grille.removeChild(grille.firstChild);cels=[];
 for(var r=0;r<N;r++)for(var c=0;c<N;c++)(function(r,c){var b=bouton("cel",lettre(r,c),function(){choisir(r,c)});b.setAttribute("aria-label","Ligne "+(r+1)+", colonne "+(c+1)+", lettre "+lettre(r,c));cels.push(b);grille.appendChild(b)})(r,c);
 while(liste.firstChild)liste.removeChild(liste.firstChild);MOTS.forEach(function(m){var d=el("div","mot",m);d.id="m_"+m;liste.appendChild(d)})}
function cel(r,c){return cels[r*N+c]}
function efface(){cels.forEach(function(b){b.classList.remove("indice")})}
function choisir(r,c){
 efface();
 if(!dep){dep=[r,c];cel(r,c).classList.add("dep");son("pop");retour.className="retour";retour.textContent="Maintenant, touche la dernière lettre.";return}
 var r0=dep[0],c0=dep[1];cel(r0,c0).classList.remove("dep");dep=null;
 var dr=r-r0,dc=c-c0,k=Math.max(Math.abs(dr),Math.abs(dc));
 if(k===0||!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))){essaie(retour);return}
 var sr=dr/k,sc=dc/k,s="",cases=[],i;for(i=0;i<=k;i++){s+=lettre(r0+sr*i,c0+sc*i);cases.push([r0+sr*i,c0+sc*i])}
 var rev=s.split("").reverse().join(""),m=null;MOTS.forEach(function(x){if(x===s||x===rev)m=x});
 if(!m){essaie(retour);return}
 if(trouves[m]){retour.className="retour";retour.textContent="Tu as déjà trouvé ce mot.";return}
 trouves[m]=true;var col=COUL[nbT%COUL.length];nbT++;cases.forEach(function(p,j){var c=cel(p[0],p[1]);c.classList.add("trouve");c.style.background=col;setTimeout(function(){c.classList.add("pulse")},j*60)});var ml=document.getElementById("m_"+m);ml.classList.add("ok");ml.style.background=col;son("ok");
 felicite(retour);
 if(Object.keys(trouves).length===MOTS.length)terminer();
}
function terminer(){confettis();finale(retour);fin.className="fin";fin.textContent="Tu as trouvé les 6 mots !";etoiles(fin);document.getElementById("bIndice").disabled=true}
document.getElementById("bIndice").addEventListener("click",function(){
 efface();var m=MOTS.filter(function(x){return!trouves[x]})[0];if(!m)return;var p=POS[m][0];cel(p[0],p[1]).classList.add("indice");
 retour.className="retour";retour.textContent="Un mot commence ici : "+m+"."});
document.getElementById("bRecom").addEventListener("click",function(){trouves={};nbT=0;dep=null;fin.className="";fin.textContent="";retour.textContent="";document.getElementById("bIndice").disabled=false;dessiner()});
var bE=document.getElementById("bEcoute");if(!AUD["mm_consigne.mp3"])bE.hidden=true;bE.addEventListener("click",function(){jouer("mm_consigne.mp3")});
dessiner();
window.PAZAPA_TEST={pos:POS,mots:MOTS};
})();</script></body></html>
